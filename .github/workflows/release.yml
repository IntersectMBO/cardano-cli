name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release (must match a project in .herald.yml)'
        required: true
        type: choice
        options:
          - cardano-cli
      version:
        description: 'Explicit version (A.B.C.D). Leave empty for auto-bump.'
        required: false
        type: string
      branch:
        description: 'Branch to release from and target for the PR. Leave empty to use the branch selected above.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # herald-release interpolates these inputs into shell scripts, so reject
      # anything that is not a plain version number or branch name.
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::version must be empty or of the form A.B.C.D"
            exit 1
          fi
          if [ -n "$BRANCH" ] && { ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format --branch "$BRANCH" > /dev/null; }; then
            echo "::error::branch must be empty or a valid branch name"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            allow-import-from-derivation = true

      - uses: input-output-hk/cardano-dev/actions/herald-release@b609066a050d9cdab63f1fe196dce4def0636aa7 # herald-release-0.0.3.1
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}
          base-branch: ${{ inputs.branch || github.ref_name }}
          chap-instructions: 'true'
