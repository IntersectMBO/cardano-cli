name: Check HLint

on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      security-events: write  # upload HLint results to code scanning
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: haskell-actions/hlint-scan@58c27088e4e1a45d453d9ade58b5ad34d09b0627 # v1.4.0
