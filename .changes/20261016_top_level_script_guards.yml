project: cardano-cli
pr: 1477
kind:
  - feature
description: Add native and Plutus V4 script guards to Dijkstra transaction build, build-raw, and build-estimate, with inline or reference scripts, guarding redeemers, and automatic or explicit execution budgets. Native reference guards use --simple-guard-script-tx-in-reference; Plutus V4 reference guards use --guard-tx-in-reference with --guard-plutus-script-v4 and require a redeemer.
