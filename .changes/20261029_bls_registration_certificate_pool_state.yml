project: cardano-cli
pr: 1490
kind:
  - feature
description: |
  `cardano-cli dijkstra stake-pool bls-registration-certificate offline` can now take the pool parameters from the output of `query pool-state` instead of a registration certificate. Pass `--pool-state-file` and `--stake-pool-id`, then choose `--current-params` to keep the pool's current parameters or `--pending-params` to keep the parameters of its pending update. With `--current-params` you must also give `--mainnet` or `--testnet-magic`, because the pool-state output does not say which network the pool's reward account belongs to. The command warns when the new certificate replaces a pending update of the pool, and when it cancels a retirement that is scheduled for the pool.
